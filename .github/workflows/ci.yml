name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  python:
    name: python driver + mapping tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: honesty check — theorem_map integrity
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('theorem_map.json'))
          tnames = [e['theorem'] for e in m['properties']]
          pids = [e['property_id'] for e in m['properties']]
          # a theorem may back several stage-2 checklist entries (lowering:
          # verbatim); among the exporter-decomposed base entries it is unique
          base = [e['theorem'] for e in m['properties'] if e.get('lowering') != 'verbatim']
          assert len(base) == len(set(base)), 'duplicate theorem among base (non-checklist) entries'
          chk = [e for e in m['properties'] if e.get('lowering') == 'verbatim']
          assert all(e['theorem'] in set(base) for e in chk), 'checklist entry cites an unmapped theorem'
          assert all(e.get('x_dataset_evidence', '').strip() for e in chk), 'checklist entry without dataset evidence'
          assert len(pids) == len(set(pids)), 'duplicate property_id in theorem_map'
          assert all(t.strip() for t in tnames), 'empty theorem name'
          assert all(p.strip() for p in pids), 'empty property_id'
          assert all(e.get('label', '').strip() for e in m['properties']), 'missing label'
          print(f'OK: {len(set(tnames))} unique theorems across {len(pids)} entries ({len(chk)} checklist), all with property_id and label')
          "
      - name: honesty check — checker_map + evidence_seeds integrity (issue #7)
        run: |
          python3 -c "
          import json
          m = json.load(open('theorem_map.json'))
          theorems = {e['theorem'] for e in m['properties']}
          labels = {e['label'] for e in m['properties']}
          cm = json.load(open('data/checker_map.json'))['checkers']
          # every checker_map key is a mapped theorem; every entry cites a checker + correctness
          for t, e in cm.items():
              assert t in theorems, f'checker_map references unmapped theorem {t}'
              assert e['checkers'], f'{t}: empty checkers'
              assert e.get('correctness'), f'{t}: no correctness theorem cited'
          seeds = json.load(open('data/evidence_seeds.json'))['seeds']
          for s in seeds:
              assert s['label'] in labels, f\"seed {s['dataset_id']} label not in use\"
              assert s['files_changed'] and s['pre_fix_code_excerpt'].strip(), s['dataset_id']
          print(f'OK: {len(cm)} checker-linked theorems, {len(seeds)} evidence seeds')
          "
      - name: honesty check — recall data files integrity (D6/D2)
        run: |
          python3 -c "
          import csv, json
          m = json.load(open('theorem_map.json'))
          map_ids = {e['property_id']: e.get('label') for e in m['properties']}
          rules = json.load(open('data/label_match_rules.json'))
          rows = list(csv.DictReader(open('data/ethereum_vulns.csv', encoding='utf-8-sig')))
          csv_ids = {r['id'] for r in rows}
          domain_labels = set(rules['domain']['labels'])
          assert {r['label'] for r in rows} <= domain_labels, 'slice row outside domain labels'
          for rule in rules['rules']:
              assert rule['rationale'].strip(), rule
              for b in rule.get('covered_by', []):
                  assert b in map_ids, f'rule names unknown property {b}'
                  assert map_ids[b] == rule['label'], f'{b} label != rule label'
          gaps = json.load(open('data/recall_gaps.json'))['gaps']
          for g in gaps:
              assert g['finding_id'] in csv_ids, f'gap for unknown finding {g[\"finding_id\"]}'
              assert g['disposition'] in ('new_target', 'out_of_model'), g
              if g['disposition'] == 'new_target':
                  assert (g.get('candidate_target') or '').strip(), f'new_target without candidate: {g[\"finding_id\"]}'
          print(f'OK: {len(rows)} slice rows, {len(rules[\"rules\"])} match rules, {len(gaps)} triaged gaps')
          "
      - name: label-grounded recall from fixture-emitted 01e (strict D2 loop)
        run: |
          speca-lean4 emit-01e \
            --scope tests/fixtures/bug_bounty_scope.sample.json \
            --health-json tests/fixtures/theorem_health.sample.json \
            --out 01e_fixture.json
          speca-lean4 verify-recall --ours 01e_fixture.json --strict
      - name: honesty check — vendored solodit reference provenance (speca#88 stage-2)
        run: |
          python3 -c "
          import hashlib, json, csv
          meta = json.load(open('data/solodit_checklist.meta.json', encoding='utf-8'))
          raw = open('data/solodit_checklist.csv', 'rb').read()
          sha = hashlib.sha1(b'blob %d\x00' % len(raw) + raw).hexdigest()
          assert sha == meta['source_blob_sha'], f'vendored bytes drifted: {sha}'
          assert b'\r' not in raw, 'CRLF crept into the vendored reference'
          rows = list(csv.DictReader(open('data/solodit_checklist.csv', encoding='utf-8-sig')))
          assert len(rows) == meta['n_rows'], (len(rows), meta['n_rows'])
          assert list(rows[0].keys()) == meta['columns'], rows[0].keys()
          print(f'OK: {len(rows)} reference items, blob {sha} matches {meta[\"source_repo\"]}@{meta[\"source_commit\"][:12]}')
          "
      - name: judge + improve harness wiring with the MOCK LLM (no API key in default CI)
        # The real LLM run is dispatch-only (judge-dispatch.yml, self-hosted
        # authenticated Claude CLI). Here the injected-LLM seam is exercised
        # end to end with the deterministic mock so this stays green keyless.
        run: |
          speca-lean4 judge \
            --ours 01e_fixture.json --id-prefix CHK- \
            --llm-cmd "python3 tests/fixtures/mock_llm.py" \
            --out judge_report_mock.json
          speca-lean4 improve \
            --ours 01e_fixture.json --id-prefix CHK- \
            --llm-cmd "python3 tests/fixtures/mock_llm.py" \
            --ref-report judge_report_mock.json \
            --out-dir improve_run_mock --max-rounds 4
          python3 -c "
          import json
          source = json.load(open('01e_fixture.json', encoding='utf-8'))['properties']
          expected_ids = {
              p['property_id'] for p in source
              if p['property_id'].startswith('CHK-')
          }
          reference_n = json.load(
              open('data/solodit_checklist.meta.json', encoding='utf-8')
          )['n_rows']
          rep = json.load(open('judge_report_mock.json', encoding='utf-8'))
          assert rep['ours']['n'] == len(expected_ids)
          assert rep['reference']['n'] == reference_n
          log = json.load(open('improve_run_mock/score_log.json', encoding='utf-8'))
          assert log['rounds'] and len(log['history_overall_mean']) == len(log['rounds'])
          assert isinstance(log['converged'], bool) and log['stop_reason']
          props = json.load(open('improve_run_mock/improved_01e.json', encoding='utf-8'))['properties']
          assert {p['property_id'] for p in props} == expected_ids
          print('OK: judge report + improve score log written with the mock adapter;',
                f\"converged={log['converged']} ({log['stop_reason']})\")
          "
      - name: ethtotal track — emit 01e from the versioned trimmed health (no Lean needed)
        # The EthTotal exporter runs on a different toolchain (4.33.0-rc1) and a
        # mathlib restore of its own, so it is not built here. What IS checked
        # here is everything downstream of it: the map builds from the reviewed
        # data files, and the 01e emits with every property `proved` against the
        # trimmed export that is versioned in the repo.
        run: |
          python3 tools/ethtotal-build-map.py
          git diff --exit-code theorem_map_ethtotal.json \
            || (echo "theorem_map_ethtotal.json is stale — rerun tools/ethtotal-build-map.py" && exit 1)
          speca-lean4 emit-01e \
            --map theorem_map_ethtotal.json \
            --scope tests/fixtures/bug_bounty_scope.ethtotal.sample.json \
            --health-json lean-ethtotal/health.mapped.json \
            --out 01e_ethtotal.json
          python3 -c "
          import json
          props = json.load(open('01e_ethtotal.json', encoding='utf-8'))['properties']
          assert props, 'no properties emitted'
          bad = [p['property_id'] for p in props if p['lean_status'] not in ('proved', 'descends-from-proved')]
          assert not bad, f'non-proved lean_status: {bad[:5]}'
          # execution-specs anchoring: every property carries a spec_reference,
          # and covers names the same surface it points at
          noref = [p['property_id'] for p in props if not p.get('spec_reference')]
          assert not noref, f'missing spec_reference: {noref[:5]}'
          split = [p['property_id'] for p in props
                   if p['covers'] != p['spec_reference'].rsplit('#', 1)[-1]]
          assert not split, f'covers disagrees with spec_reference: {split[:5]}'
          print(f'OK: {len(props)} EthTotal properties, all proved or descends-from-proved,')
          print(f'    all anchored to execution-specs with covers == anchor symbol')
          "
      - name: ethvuln track — emit 01e from the versioned fixture health (no Lean needed)
        # ethereum-vuln-dataset track (speca#146 c-1): its own map, its own
        # exporter entry point (lean/MainEthVuln.lean, checked in the lean job)
        # and its own fixture health, which is real `speca-export-ethvuln`
        # output. Honesty: the emitted 01e must say exactly what the exporter
        # said (all proved since the PR #24 review revision; unknown if a
        # sorry ever regressed) -- this step asserts the status is COPIED
        # from the health, never upgraded, rather than asserting any
        # particular value.
        run: |
          speca-lean4 emit-01e \
            --map theorem_map_ethvuln.json \
            --scope tests/fixtures/bug_bounty_scope.ethvuln.sample.json \
            --health-json tests/fixtures/theorem_health.ethvuln.sample.json \
            --out 01e_ethvuln_fixture.json
          python3 -c "
          import json
          props = json.load(open('01e_ethvuln_fixture.json', encoding='utf-8'))['properties']
          entries = json.load(open('theorem_map_ethvuln.json', encoding='utf-8'))['properties']
          health = {t['name']: t for t in json.load(open('tests/fixtures/theorem_health.ethvuln.sample.json', encoding='utf-8'))['theorems']}
          assert props and len(props) >= len(entries)
          ids = {p['property_id'] for p in props}
          by_id = {e['property_id']: e for e in entries}
          for e in entries:
              b = e['property_id']
              assert b in ids or any(i.startswith(b + '-me') for i in ids), b
          n = {}
          for p in props:
              th = health[by_id[p['property_id'].split('-me')[0]]['theorem']]
              assert th['resolved'], p['property_id']
              assert p['lean_status'] == th['lean_status'], (p['property_id'], p['lean_status'], th['lean_status'])
              assert p['lean_status'] != 'proved' or th['sorry_free'], p['property_id']
              n[p['lean_status']] = n.get(p['lean_status'], 0) + 1
          print(f'OK: {len(props)} ethvuln properties from {len(entries)} theorems; lean_status copied from the exporter: {n}')
          "

  lean:
    name: lean exporter build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: cache lake workspace (deps + build outputs)
        uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}-${{ github.run_id }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.lean') }}-
            lake-${{ runner.os }}-
      - name: lake update (resolve gasper-lean4 + transitive deps)
        working-directory: lean
        run: lake update
      - name: fetch mathlib olean cache (gasper-lean4 depends on mathlib)
        working-directory: lean
        run: lake exe cache get
      - name: lake build (gasper-lean4 + speca-export)
        working-directory: lean
        run: lake build
      - name: smoke — export health for the mapped theorems
        working-directory: lean
        run: |
          python3 - <<'PY' > targets.txt
          import json
          m = json.load(open("../theorem_map.json"))
          # dedupe: several checklist entries may share one theorem
          print("\n".join(dict.fromkeys(e["theorem"] for e in m["properties"])))
          PY
          lake exe speca-export --targets targets.txt > health.json
          python3 - <<'PY'
          import json
          h = json.load(open("health.json"))
          bad = [t["name"] for t in h["theorems"] if not t["resolved"]]
          assert not bad, f"unresolved target theorems: {bad}"
          # enriched-boundary contract (issue #3 + #16/#17): every record
          # carries A1-A7 plus the A3+/A7+ refinements
          for t in h["theorems"]:
              for key in ("statement", "conclusion", "hypotheses",
                          "referenced_constants", "gasper_axioms",
                          "proof_provenance", "proof_code", "proof_constants",
                          "proof_source", "referenced_defs_expanded",
                          "doc_string"):
                  assert key in t, f"{t['name']} missing {key}"
              assert t["statement"], f"{t['name']} has empty statement"
              # A3+ (#16): every expanded def is a fully-populated record,
              # gasper-local only, within the exporter's stated total cap
              assert len(t["referenced_defs_expanded"]) <= 24, t["name"]
              for d in t["referenced_defs_expanded"]:
                  assert d["name"].startswith("GasperBeaconChain."), (t["name"], d)
                  assert d["kind"] and d["pp"], (t["name"], d["name"])
          n_me = sum(1 for t in h["theorems"] for hy in t["hypotheses"]
                     if hy.get("class") == "must-establish")
          n_src = sum(1 for t in h["theorems"] if t["proof_source"])
          n_exp = sum(1 for t in h["theorems"] if t["referenced_defs_expanded"])
          n_defs = sum(len(t["referenced_defs_expanded"]) for t in h["theorems"])
          n_doc = sum(1 for t in h["theorems"] if t["doc_string"])
          # A3+ must fire on the real export: gasper statements reference
          # gasper-local defs, so a fully-empty expansion would be a bug
          assert n_exp > 0, "no theorem got referenced_defs_expanded"
          print(f"all {len(h['theorems'])} targets resolved;",
                sum(1 for t in h["theorems"] if t["lean_status"] == "proved"),
                f"proved; {n_me} must-establish hypotheses; "
                f"{n_src} with verbatim proof source; "
                f"{n_exp} with expanded defs ({n_defs} defs total); "
                f"{n_doc} with docstrings")
          PY
      - name: end-to-end — emit 01e from real Lean health
        run: |
          pip install -e '.[dev]'
          speca-lean4 emit-01e \
            --scope tests/fixtures/bug_bounty_scope.sample.json \
            --health-json lean/health.json \
            --out 01e_lean.json \
            --out-dir 01e_lean_shards
          python3 - <<'PY'
          import json
          d = json.load(open("01e_lean.json"))
          props = d["properties"]
          assert props, "no properties"
          entries = json.load(open("theorem_map.json"))["properties"]
          # B1: >= one property per theorem; every entry represented
          assert len(props) >= len(entries), (len(props), len(entries))
          ids = {p["property_id"] for p in props}
          for e in entries:
              b = e["property_id"]
              assert b in ids or any(i.startswith(b + "-me") for i in ids), b
          # B5: the type-consistency gate must not flag real Lean output
          bad = [p["property_id"] for p in props
                 if p.get("lean_type_consistency") == "mismatch"]
          assert not bad, f"type-consistency mismatches: {bad}"
          n_me = sum(1 for p in props if p.get("lean_precondition"))
          print(f"{len(props)} properties emitted from real Lean health "
                f"({n_me} must-establish-decomposed, from {len(entries)} theorems)")
          PY
      - name: label-grounded recall from the REAL emitted 01e (D3/D6, strict)
        run: |
          speca-lean4 verify-recall --ours 01e_lean.json --strict \
            --out recall_report.json
      - name: ethvuln track — export health for the mapped theorems (speca#146 c-1)
        # Same workspace, different entry point: `speca-export-ethvuln`
        # (lean/MainEthVuln.lean) loads the in-repo SpecaExport.EthVuln
        # modules that the gasper `speca-export` deliberately does not. The
        # gate is the same as the gasper smoke above -- every target must
        # resolve -- plus the honesty pairing proved <=> sorry_free. Proof
        # status itself is reported, not asserted: since the PR #24 review
        # revision the 66 shallow implications are proved, and this step
        # would stay green (and honest) if one regressed to `sorry`.
        working-directory: lean
        run: |
          python3 - <<'PY' > targets_ethvuln.txt
          import json
          m = json.load(open("../theorem_map_ethvuln.json"))
          print("\n".join(dict.fromkeys(e["theorem"] for e in m["properties"])))
          PY
          lake exe speca-export-ethvuln --targets targets_ethvuln.txt \
            --output health_ethvuln.json --src-root .
          python3 - <<'PY'
          import json
          h = json.load(open("health_ethvuln.json"))
          assert h["project"] == "EthVulnFormalProps", h["project"]
          bad = [t["name"] for t in h["theorems"] if not t["resolved"]]
          assert not bad, f"unresolved target theorems: {bad}"
          for t in h["theorems"]:
              for key in ("statement", "conclusion", "hypotheses",
                          "referenced_constants", "gasper_axioms",
                          "proof_provenance", "proof_code", "proof_constants",
                          "proof_source", "referenced_defs_expanded",
                          "doc_string"):
                  assert key in t, f"{t['name']} missing {key}"
              assert t["statement"], f"{t['name']} has empty statement"
              assert t["module"].startswith("SpecaExport.EthVuln.Props."), t["name"]
              assert len(t["referenced_defs_expanded"]) <= 24, t["name"]
              for d in t["referenced_defs_expanded"]:
                  assert d["name"].startswith("EthVulnFormalProps."), (t["name"], d)
                  assert d["kind"] and d["pp"], (t["name"], d["name"])
              assert t["lean_status"] in ("proved", "unknown"), (t["name"], t["lean_status"])
              assert t["sorry_free"] == (t["lean_status"] == "proved"), t["name"]
          n_proved = sum(1 for t in h["theorems"] if t["lean_status"] == "proved")
          n_me = sum(1 for t in h["theorems"] for hy in t["hypotheses"]
                     if hy.get("class") == "must-establish")
          n_src = sum(1 for t in h["theorems"] if t["proof_source"])
          n_doc = sum(1 for t in h["theorems"] if t["doc_string"])
          print(f"all {len(h['theorems'])} ethvuln targets resolved; {n_proved} proved, "
                f"{len(h['theorems']) - n_proved} unknown (sorry-dependent); "
                f"{n_me} must-establish hypotheses; {n_src} with verbatim proof source; "
                f"{n_doc} with docstrings")
          PY
      - name: ethvuln track — map staleness gate (packets + anchors regenerate to a zero diff)
        # theorem_map_ethvuln.json's audit_packet / x_spec_anchor fields are
        # deterministic functions of the exporter health and the committed
        # curation (data/ethvuln_spec_anchors.json). Regenerating them from
        # the health just exported must be a no-op, exactly like the
        # theorem_map_ethtotal.json gate above -- a diff here means the map
        # was edited without rerunning the tool (or vice versa).
        run: |
          python3 tools/ethvuln-build-packets.py \
            --map theorem_map_ethvuln.json \
            --health lean/health_ethvuln.json \
            --anchors data/ethvuln_spec_anchors.json
          git diff --exit-code theorem_map_ethvuln.json
      - name: ethvuln track — emit 01e from the real health
        run: |
          speca-lean4 emit-01e \
            --map theorem_map_ethvuln.json \
            --scope tests/fixtures/bug_bounty_scope.ethvuln.sample.json \
            --health-json lean/health_ethvuln.json \
            --out 01e_ethvuln.json \
            --out-dir 01e_ethvuln_shards
          python3 - <<'PY'
          import json
          props = json.load(open("01e_ethvuln.json"))["properties"]
          entries = json.load(open("theorem_map_ethvuln.json"))["properties"]
          health = {t["name"]: t for t in json.load(open("lean/health_ethvuln.json"))["theorems"]}
          assert props and len(props) >= len(entries), (len(props), len(entries))
          ids = {p["property_id"] for p in props}
          by_id = {e["property_id"]: e for e in entries}
          for e in entries:
              b = e["property_id"]
              assert b in ids or any(i.startswith(b + "-me") for i in ids), b
          bad = [p["property_id"] for p in props
                 if p.get("lean_type_consistency") == "mismatch"]
          assert not bad, f"type-consistency mismatches: {bad}"
          n = {}
          for p in props:
              th = health[by_id[p["property_id"].split("-me")[0]]["theorem"]]
              assert p["lean_status"] == th["lean_status"], p["property_id"]
              n[p["lean_status"]] = n.get(p["lean_status"], 0) + 1
          print(f"{len(props)} ethvuln properties emitted from real Lean health "
                f"(from {len(entries)} theorems); lean_status: {n}")
          PY
      - name: upload real Lean health + 01e output
        uses: actions/upload-artifact@v4
        with:
          name: lean-health-and-01e
          path: |
            lean/health.json
            01e_lean.json
            01e_lean_shards/
            recall_report.json
            lean/health_ethvuln.json
            01e_ethvuln.json
            01e_ethvuln_shards/
          retention-days: 30

  run-lean-e2e:
    # Regression guard for the path speca actually exercises (speca#88;
    # broke in speca run 29749878252): `emit-01e/emit-kurtosis --run-lean`,
    # where the FIRST lake contact happens inside the CLI's `_run_lean` on a
    # cold workspace — elan resolves the toolchain, lake fetches deps and
    # builds, all interleaving progress into stdout before the exporter runs.
    # Deliberately NO lake-workspace cache and NO prior `lake update/build`
    # step: warming the workspace first would hide exactly the failure this
    # job exists to catch. Keep it cold even if it costs minutes.
    name: speca-shaped --run-lean e2e (cold lake workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - name: install elan exactly as speca does (no default toolchain)
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: emit-01e --run-lean (cold — first lake contact inside the CLI)
        run: |
          speca-lean4 emit-01e \
            --scope tests/fixtures/bug_bounty_scope.sample.json \
            --run-lean \
            --out 01e_runlean.json
      - name: emit-kurtosis --run-lean (speca's default subcommand; warm lake)
        run: |
          python3 -m speca_lean4.cli emit-kurtosis \
            --scope tests/fixtures/bug_bounty_scope.sample.json \
            --run-lean \
            --fixtures-dir outputs/kurtosis \
            --out 01e_kurtosis.json
      - name: verify real proved health reached both emissions
        run: |
          python3 - <<'PY'
          import json
          for fp in ("01e_runlean.json", "01e_kurtosis.json"):
              props = json.load(open(fp))["properties"]
              assert props, f"{fp}: no properties"
              n = sum(1 for p in props if p.get("lean_status") == "proved")
              assert n > 0, f"{fp}: no proved property from the real Lean run"
              print(f"{fp}: {len(props)} properties, {n} proved")
          PY
      - name: ethvuln track — emit-01e --run-lean (map-selected exe, warm lake)
        # theorem_map_ethvuln.json names its own executable (`lean_exe`), so
        # `--run-lean` must invoke `lake exe speca-export-ethvuln` -- the
        # gasper exporter would leave every EthVulnFormalProps.* target
        # unresolved. The 01e does not carry `resolved`, so the proxy is the
        # module path: an unresolved record has no module and its
        # lean_artifact degrades to `source@ref#name` with no `:path`.
        run: |
          speca-lean4 emit-01e \
            --map theorem_map_ethvuln.json \
            --scope tests/fixtures/bug_bounty_scope.ethvuln.sample.json \
            --run-lean \
            --out 01e_ethvuln_runlean.json
          python3 - <<'PY'
          import json
          props = json.load(open("01e_ethvuln_runlean.json"))["properties"]
          entries = json.load(open("theorem_map_ethvuln.json"))["properties"]
          assert props and len(props) >= len(entries)
          bad = [p["property_id"] for p in props
                 if ":SpecaExport/EthVuln/Props/" not in p["lean_artifact"]
                 or not p.get("lean_statement")]
          assert not bad, f"targets not resolved by --run-lean: {bad[:5]}"
          n = {}
          for p in props:
              n[p["lean_status"]] = n.get(p["lean_status"], 0) + 1
          print(f"01e_ethvuln_runlean.json: {len(props)} properties, all resolved; lean_status: {n}")
          PY
